[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-comic-book-reader"
version = "1.4.1"
description = "Leitor de quadrinhos local com biblioteca e API opcional."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "Pillow>=10,<13",
  "rarfile>=4,<5",
  "PyMuPDF>=1.24,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
server = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
panel-reader = "panel_app.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["panel_app*", "panel_backend*", "panel_client*"]
