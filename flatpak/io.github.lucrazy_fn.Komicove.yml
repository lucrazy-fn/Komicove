id: io.github.lucrazy_fn.Komicove
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: komicove

# Tkinter não usa o portal de arquivos (xdg-desktop-portal), então o próprio
# diálogo "Escolher pasta" do app só vê o que o sandbox permite. Por isso é
# preciso liberar --filesystem=home (mesma solução usada pelo Thonny, que
# também é feito em Tkinter). --share=network é usado pelo login/downloads/
# checagem de atualização opcionais do app.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --filesystem=home
  - --env=KOMICOVE_APPDATA_DIR=
  - --env=KOMICOVE_PANEL_MODEL=/app/local_models/inkwell.onnx

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  # ---------------------------------------------------------------------
  # Tkinter não vem no Python do org.freedesktop.Sdk. Construímos Tcl/Tk
  # a partir do código-fonte e o módulo _tkinter separadamente, seguindo
  # a receita usada pelo Thonny (também um app Tkinter) no Flathub.
  # https://github.com/iwalton3/tkinter-standalone
  # ---------------------------------------------------------------------
  - name: tkinter
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation .
    sources:
      - type: git
        url: https://github.com/iwalton3/tkinter-standalone
        commit: 8e78e38ef0cceb44a3a0062e1c314a4ff3f981db
    modules:
      - name: tcl9.0
        buildsystem: autotools
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9.0.so
        cleanup:
          - /bin
          - /lib/pkgconfig
          - /man
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tcl9.0.2-src.tar.gz
            sha256: e074c6a8d9ba2cddf914ba97b6677a552d7a52a3ca102924389a05ccb249b520
      - name: tk9.0
        buildsystem: autotools
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9tk9.0.so
        cleanup:
          - /bin
          - /lib/pkgconfig
          - /man
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tk9.0.2-src.tar.gz
            sha256: 76fb852b2f167592fe8b41aa6549ce4e486dbf3b259a269646600e3894517c76

  # ---------------------------------------------------------------------
  # Dependências Python do Komicove (pyproject.toml), como wheels prontas
  # (manylinux) para evitar compilar Pillow/PyMuPDF do zero no sandbox.
  # Gerado com o flatpak-pip-generator e ajustado para usar wheels.
  # ---------------------------------------------------------------------
  - name: python3-Pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation "Pillow==12.3.0"
    sources:
