  - name: komicove
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation .
      - install -Dm644 local_models/inkwell.onnx ${FLATPAK_DEST}/local_models/inkwell.onnx
      - install -Dm644 installer/inkwell/AGPL-3.0.txt ${FLATPAK_DEST}/local_models/AGPL-3.0.txt
      - install -Dm644 installer/inkwell/NOTICE.txt ${FLATPAK_DEST}/local_models/NOTICE.txt
      - mkdir -p ${FLATPAK_DEST}/Icons
      - cp -r Icons/* ${FLATPAK_DEST}/Icons/
      - cp -r assets_redesign ${FLATPAK_DEST}/assets_redesign
      - install -Dm644 komicovelogo.png ${FLATPAK_DEST}/komicovelogo.png
      - install -Dm644 flatpak/io.github.lucrazy_fn.Komicove.desktop
        ${FLATPAK_DEST}/share/applications/io.github.lucrazy_fn.Komicove.desktop
      - install -Dm644 flatpak/io.github.lucrazy_fn.Komicove.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.lucrazy_fn.Komicove.metainfo.xml
      - install -Dm644 flatpak/Komicove-128.png
        ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.lucrazy_fn.Komicove.png
      - install -Dm644 flatpak/Komicove-256.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.lucrazy_fn.Komicove.png
      - install -Dm644 flatpak/Komicove-512.png
        ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.lucrazy_fn.Komicove.png
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - android
          - local_models
          - __pycache__
          - tests
          - tools
          - docs
          - .github
          - .flatpak-builder
          - build-dir
          - build
          - dist
          - .venv
          - .venv-linux
          - .idea
          - .env
          - panel_storage
          - panel.db
          - komicove_storage
          - komicove.db
          - docs/security-audit
      - type: file
        path: ../local_models/inkwell.onnx
        dest: local_models
        sha256: f240e1296efd048126b26ea4ffeddc97d7c3aa667a37e3127c2afc6d5e9b9578
