  # ---------------------------------------------------------------------
  # O app em si. Troque "url"/"tag" pela branch/tag real que você quer
  # publicar, ou use "type: dir" com "path: ../.." para empacotar a partir
  # do checkout local em vez do GitHub.
  # ---------------------------------------------------------------------
  - name: sevenzip
    buildsystem: simple
    build-commands:
      - install -Dm755 7zz ${FLATPAK_DEST}/bin/7zz
      - install -Dm644 License.txt ${FLATPAK_DEST}/share/licenses/7zip/License.txt
    sources:
      - type: archive
        url: https://www.7-zip.org/a/7z2604-linux-x64.tar.xz
        sha256: fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: https://www.7-zip.org/a/7z2604-linux-arm64.tar.xz
        sha256: 5b0ac3aa91c1e3499f011d6af69d7f6b4de3ef2f011d9e2ff44c58ebd04aa388
        strip-components: 0
        only-arches: [aarch64]

  - name: python3-local-ai
