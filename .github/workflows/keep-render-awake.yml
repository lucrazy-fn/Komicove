name: Manter API ativa

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Acordar API do Komicove
        run: |
          echo "Ping iniciado em $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          status=$(curl \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            --retry-all-errors \
            "https://panel-api-tr1a.onrender.com/health")
          echo "API respondeu HTTP $status"
          test "$status" -ge 200 -a "$status" -lt 400
