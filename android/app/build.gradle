plugins { id 'com.android.application' }
android {
    namespace 'com.lucrazy.komicove'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lucrazy.panel'
        minSdk 26
        targetSdk 35
        versionCode 10603
        versionName '0.1.0'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.includeAndroidResources = true }
}

tasks.register('copyNamedDebugApk', Copy) {
    dependsOn('assembleDebug')
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(rootProject.layout.projectDirectory.dir('build/outputs/named'))
    rename { "Komicove-Android-${android.defaultConfig.versionName}.apk" }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.junrar:junrar:7.5.5'
    implementation 'me.zhanghai.android.libarchive:library:1.1.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
