<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komicove: Administração</title><style>
:root{color-scheme:dark;--bg:#090b10;--card:#151821;--soft:#202430;--line:#323746;--text:#f5f6f8;--muted:#a2a8b7;--accent:#7c5cff;--red:#ff647c;--green:#43d19e;--amber:#f5b94c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#2b2257 0,transparent 36%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}main{width:min(1180px,calc(100% - 30px));margin:auto;padding:38px 0 70px}.hidden{display:none!important}.brand{color:#b9abff;font-weight:900;letter-spacing:.15em}.head,.toolbar,.userhead{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(2rem,5vw,3rem);margin:5px 0 0}h2,h3{margin:0}.muted,p,small{color:var(--muted)}.card{background:#151821f5;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 55px #0005}.login{width:min(450px,100%);margin:12vh auto;text-align:center}.login label{text-align:left}.login p{margin-bottom:24px}label{display:block;color:var(--muted);font-size:.9rem;margin:13px 0 6px}input,select{width:100%;padding:12px;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:10px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff22}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:var(--soft);border:1px solid var(--line)}.btn.danger{background:#ff647c18;border:1px solid #ff647c55;color:#ff9aaa}.wide{width:100%;margin-top:18px}.notice{min-height:22px;margin-top:10px}.error{color:#ff9aaa}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin:28px 0 18px}.tab{white-space:nowrap;background:transparent;border:0;color:var(--muted);padding:12px 15px;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:#fff;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.stat b{display:block;font-size:2rem}.stat span{color:var(--muted)}.grid{display:grid;grid-template-columns:370px 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.history,.users{display:grid;gap:10px;margin-top:15px}.invite,.user,.log,.publication{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:14px}.invite{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:.78rem;background:#7c5cff22;color:#c8bdff;margin:5px 6px 2px 0}.green{background:#43d19e22;color:#78e5bd}.red{background:#ff647c22;color:#ff9aaa}.amber{background:#f5b94c20;color:#f7cb79}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions .btn{font-size:.82rem;padding:7px 10px}.toolbar input{max-width:330px}.secret{padding:13px;background:#0b0d12;border:1px dashed #6553bd;border-radius:11px;overflow-wrap:anywhere;font-family:monospace;margin-top:12px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:10}.dialog{width:min(560px,100%);max-height:88vh;overflow:auto}.dialog.wide-dialog{width:min(820px,100%)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.detail-stats div{background:var(--soft);padding:12px;border-radius:10px;text-align:center}.detail-stats b{display:block;font-size:1.4rem}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.head,.toolbar,.userhead{align-items:stretch;flex-direction:column}.toolbar input{max-width:none}.detail-stats{grid-template-columns:1fr 1fr}}

:root{--violet:#8b6cff;--violet-2:#5e42d7;--glow:#9d87ff;--panel:#12141d;--panel-2:#191c28;--ring:#8b6cff38}
html{scroll-behavior:smooth}body{overflow-x:hidden;background:
radial-gradient(900px 520px at 12% -12%,#5535b52c,transparent 62%),
radial-gradient(700px 500px at 95% 5%,#7c5cff18,transparent 65%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#fff015 1px,transparent 1px),linear-gradient(90deg,#fff012 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent 65%)}
main{position:relative}.brand{display:inline-flex;align-items:center;gap:9px;font-size:.86rem}.brand:before{content:"";width:9px;height:9px;background:var(--glow);transform:rotate(45deg);box-shadow:0 0 18px var(--glow);animation:pulse 2.6s ease-in-out infinite}
.card{background:linear-gradient(145deg,#181b25f5,#11131bf5);border-color:#ffffff17;box-shadow:0 24px 70px #0008,0 1px 0 #ffffff0a inset;backdrop-filter:blur(18px)}
.login{margin:9vh auto;padding:34px 34px 30px;animation:loginIn .55s cubic-bezier(.2,.8,.2,1) both}.login h1{font-size:2.35rem;letter-spacing:-.045em}.login .login-kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:#8e95a8}.login input{padding:14px 15px}
input,select{transition:border-color .2s,box-shadow .2s,background .2s,transform .2s}input:hover,select:hover{background:#242837}input:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--ring)}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--violet),var(--violet-2));box-shadow:0 8px 22px #6248da35;transition:transform .18s ease,box-shadow .18s ease,filter .18s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px #6248da52;filter:brightness(1.08)}.btn:active{transform:translateY(0) scale(.98)}.btn:disabled{opacity:.55;cursor:wait;transform:none}.btn.secondary{box-shadow:none;background:#232634}.btn.danger{box-shadow:none}
.topbar{padding:8px 2px 4px}.topbar h1{letter-spacing:-.05em}.account-chip{display:flex;align-items:center;gap:10px}.account-chip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.tabs{position:sticky;top:0;z-index:5;padding:9px;background:#0c0e14dc;border:1px solid #ffffff10;border-radius:15px;backdrop-filter:blur(18px);box-shadow:0 12px 35px #0004}.tab{position:relative;border:0!important;border-radius:10px;transition:color .2s,background .2s,transform .2s}.tab:hover{color:#fff;background:#ffffff09}.tab.active{background:linear-gradient(135deg,#7c5cff2a,#7c5cff12);color:#e8e3ff;box-shadow:0 0 0 1px #9079ff35 inset}.tab.active:after{content:"";position:absolute;left:18px;right:18px;bottom:4px;height:2px;border-radius:2px;background:var(--glow);box-shadow:0 0 10px var(--glow)}
.panel:not(.hidden){animation:panelIn .32s ease both}.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{position:relative;overflow:hidden;padding:21px;background:linear-gradient(145deg,var(--panel-2),var(--panel));border-color:#ffffff13;transition:transform .22s,border-color .22s,box-shadow .22s}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-45px;background:var(--violet);filter:blur(35px);opacity:.12}.stat:hover{transform:translateY(-4px);border-color:#8b6cff55;box-shadow:0 18px 38px #0005}.stat b{font-size:2.25rem;letter-spacing:-.05em}.stat span{font-size:.88rem}
.invite,.user,.log,.publication{transition:transform .2s,border-color .2s,background .2s}.invite:hover,.user:hover,.log:hover,.publication:hover{transform:translateX(3px);border-color:#8b6cff45;background:#242837}.user{padding:18px}.badge{border:1px solid currentColor;border-color:#ffffff13}.secret{background:#090b11;box-shadow:0 0 0 4px #7c5cff0d inset}
.overlay{backdrop-filter:blur(8px);animation:fadeIn .2s ease}.overlay:not(.hidden) .dialog{animation:dialogIn .28s cubic-bezier(.2,.9,.2,1)}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.notice:not(:empty){padding:9px 11px;border-radius:9px;background:#ffffff07}.notice.error:not(:empty){background:#ff647c12}
@keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}@keyframes panelIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes dialogIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pulse{50%{opacity:.55;box-shadow:0 0 8px var(--glow)}}
@media(max-width:600px){main{width:min(100% - 20px,1180px);padding-top:18px}.login{margin:3vh auto;padding:26px 20px}.tabs{top:6px}.tab{padding:10px 12px}.stats{grid-template-columns:1fr 1fr}.stat{padding:16px}.stat b{font-size:1.75rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style></head><body>
<main id="login" class="login card"><div class="brand">Komicove</div><h1>Administração</h1><p class="login-kicker">Acesso seguro da equipe</p><label for="username">Usuário</label><input id="username" autocomplete="username" placeholder="seu usuário"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"><label for="totp">Código 2FA <small>(se ativado)</small></label><input id="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="loginBtn" class="btn wide">Entrar no painel</button><div id="loginMsg" class="notice" role="status"></div></main>
<main id="app" class="hidden"><header class="head topbar"><div><div class="brand">Komicove</div><h1>Administração</h1><p class="muted">Controle de acesso, contas e atividade.</p></div><button id="logoutBtn" class="btn secondary account-chip">Sair</button></header><nav class="tabs" aria-label="Seções administrativas"><button class="tab active" data-tab="dashboard">Visão geral</button><button class="tab" data-tab="invites">Tokens</button><button class="tab" data-tab="accounts">Contas</button><button class="tab" data-tab="audit">Histórico</button></nav>
<section id="dashboard" class="panel"><div id="stats" class="stats"></div></section>
<section id="invites" class="panel hidden"><div class="grid"><article class="card"><h2>Novo token de administrador</h2><p>Somente uma conta que já seja moderadora poderá usá-lo.</p><label>Usos</label><input id="uses" type="number" min="1" max="5" value="1"><div class="row"><div><label>Validade</label><input id="duration" type="number" min="1" max="5" value="1"></div><div><label>Unidade</label><select id="unit"><option value="24">dias</option><option value="1">horas</option></select></div></div><button id="generateBtn" class="btn wide">Gerar token</button><div id="generateMsg" class="notice"></div><div id="result" class="hidden"><div id="secret" class="secret"></div><button id="copyBtn" class="btn secondary wide">Copiar</button></div></article><article class="card"><h2>Histórico de tokens</h2><div id="inviteRows" class="history"></div></article></div></section>
<section id="accounts" class="panel hidden"><article class="card"><div class="toolbar"><div><h2>Contas</h2><p id="accountCount"></p></div><input id="search" placeholder="Buscar usuário ou e-mail"></div><div id="userRows" class="users"></div></article></section>
<section id="audit" class="panel hidden"><article class="card"><div class="toolbar"><div><h2>Histórico administrativo</h2><p>Últimas 250 ações</p></div><button id="refreshAudit" class="btn secondary">Atualizar</button></div><div id="auditRows" class="history"></div></article></section></main>
<div id="actionModal" class="overlay hidden"><div class="dialog card"><h2 id="actionTitle"></h2><p id="actionText"></p><div id="reasonFields" class="hidden"><label>Motivo</label><input id="reason" maxlength="255"><div id="durationFields"><label>Duração</label><select id="punishDuration"><option value="1">1 hora</option><option value="24">1 dia</option><option value="168">7 dias</option><option value="720">30 dias</option></select></div></div><div class="dialog-actions"><button id="cancelAction" class="btn secondary">Cancelar</button><button id="confirmAction" class="btn danger">Confirmar</button></div><div id="actionMsg" class="notice"></div></div></div>
<div id="detailModal" class="overlay hidden"><div class="dialog wide-dialog card"><div class="toolbar"><h2 id="detailTitle">Conta</h2><button id="closeDetail" class="btn secondary">Fechar</button></div><div id="detailBody"></div></div></div>
<script>
let token='',me=null,users=[],pending=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=v=>{if(!v)return 'Sem registro';const value=String(v),d=new Date(/[zZ]$|[+-]\d{2}:\d{2}$/.test(value)?value:value+'Z');return Number.isNaN(d.getTime())?'Sem registro':d.toLocaleString('pt-BR')};
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}});if(!r.ok){let m=`Erro ${r.status}`;try{m=(await r.json()).detail||m}catch{}throw Error(m)}return r.status===204?null:r.json()}function msg(id,t,b=false){$(id).textContent=t;$(id).className=`notice${b?' error':''}`}
async function login(){const b=$('loginBtn');b.disabled=true;b.textContent='Entrando…';try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,totp_code:$('totp').value||null})});if(!['admin','owner'].includes(d.user.role))throw Error('Este painel exige uma conta administradora.');token=d.token;me=d.user;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logoutBtn').title=`Conectado como @${me.username}`;await Promise.all([loadDashboard(),loadInvites(),loadUsers(),loadAudit()])}catch(e){msg('loginMsg',e.message,true)}finally{b.disabled=false;b.textContent='Entrar no painel'}}$('loginBtn').onclick=login;['password','totp'].forEach(id=>$(id).onkeydown=e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab))});
async function loadDashboard(){const d=await api('/api/moderators/dashboard'),items=[['Contas',d.total_users],['Ativas',d.active_users],['Suspensas',d.suspended_users],['Banidas',d.banned_users],['Equipe',d.moderators],['Aguardando análise',d.pending_publications],['Tokens ativos',d.active_invites]];$('stats').innerHTML=items.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
$('unit').onchange=()=>{$('duration').max=$('unit').value==='24'?5:120};$('generateBtn').onclick=async()=>{try{const d=await api('/api/moderator-tokens',{method:'POST',body:JSON.stringify({max_uses:+$('uses').value,valid_hours:+$('duration').value*+$('unit').value})});$('secret').textContent=d.secret;$('result').classList.remove('hidden');msg('generateMsg',`Válido até ${date(d.expires_at)}`);await Promise.all([loadInvites(),loadDashboard(),loadAudit()])}catch(e){msg('generateMsg',e.message,true)}};$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('secret').textContent);$('copyBtn').textContent='Copiado!'};
async function loadInvites(){const rows=await api('/api/moderator-tokens');$('inviteRows').innerHTML=rows.map(i=>{const on=!i.revoked&&i.use_count<i.max_uses&&new Date(i.expires_at+'Z')>new Date();return `<div class="invite"><div><b>${i.use_count}/${i.max_uses} usos</b><small>Expira ${date(i.expires_at)}</small></div>${on?`<button class="btn danger" data-revoke="${i.id}">Revogar</button>`:'<span class="badge red">Encerrado</span>'}</div>`}).join('')||'<p>Nenhum convite.</p>';document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{await api(`/api/moderator-tokens/${b.dataset.revoke}`,{method:'DELETE'});await Promise.all([loadInvites(),loadDashboard(),loadAudit()])})}
const roles={user:'Usuário',moderator:'Moderador',admin:'Administrador',owner:'Dono'};function status(u){if(!u.is_active)return '<span class="badge red">Banida</span>';if(u.suspended_until&&new Date(u.suspended_until+'Z')>new Date())return '<span class="badge amber">Suspensa</span>';return '<span class="badge green">Ativa</span>'}function renderUsers(){const q=$('search').value.toLowerCase(),rows=users.filter(u=>`${u.username} ${u.email||''}`.toLowerCase().includes(q));$('accountCount').textContent=`${rows.length} conta(s)`;$('userRows').innerHTML=rows.map(u=>{const lock=u.id===me.id||u.role==='owner'||(me.role==='admin'&&u.role==='admin'),cargo=me.role==='owner'&&!lock&&u.role!=='admin'?`<button class="btn secondary" data-act="set_role" data-role="${u.role==='moderator'?'user':'moderator'}" data-id="${u.id}">${u.role==='moderator'?'Tirar moderador':'Dar moderador'}</button>`:'';return `<div class="user"><div class="userhead"><div><h3>${esc(u.display_name)} <small>@${esc(u.username)}</small></h3><div>${status(u)}<span class="badge">${roles[u.role]}</span></div><small>Criada em: ${esc(date(u.created_at))}<br>Último acesso à API: ${esc(date(u.last_seen_at))}</small>${u.punishment_reason?`<small class="error">${esc(u.punishment_reason)}</small>`:''}</div><button class="btn secondary" data-detail="${u.id}">Ver detalhes</button></div><div class="actions">${cargo}${lock?'':`<button class="btn secondary" data-act="revoke_sessions" data-id="${u.id}">Desconectar</button><button class="btn secondary" data-act="suspend" data-id="${u.id}">Suspender</button>${!u.is_active||u.suspended_until?`<button class="btn secondary" data-act="clear_punishment" data-id="${u.id}">Remover punição</button>`:`<button class="btn danger" data-act="ban" data-id="${u.id}">Banir</button>`}<button class="btn danger" data-act="delete" data-id="${u.id}">Excluir</button>`}</div></div>`}).join('')||'<p>Nenhuma conta.</p>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>openAction(b.dataset.id,b.dataset.act,b.dataset.role));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail))}async function loadUsers(){users=await api('/api/moderators/users');renderUsers()}$('search').oninput=renderUsers;
const names={set_role:'Alterar cargo',suspend:'Suspender conta',ban:'Banir conta',clear_punishment:'Remover punição',revoke_sessions:'Desconectar dispositivos',delete:'Excluir conta'};function openAction(id,action,role=null){const u=users.find(x=>x.id===id);pending={u,action,role};$('actionTitle').textContent=names[action];$('actionText').textContent=action==='set_role'?`Alterar @${u.username} para ${roles[role]}?`:`Confirmar ação em @${u.username}?`;$('reasonFields').classList.toggle('hidden',!['suspend','ban'].includes(action));$('durationFields').classList.toggle('hidden',action!=='suspend');$('reason').value='';msg('actionMsg','');$('actionModal').classList.remove('hidden')}$('cancelAction').onclick=()=>$('actionModal').classList.add('hidden');$('confirmAction').onclick=async()=>{const {u,action,role}=pending;try{if(action==='delete')await api(`/api/moderators/users/${u.id}`,{method:'DELETE'});else await api(`/api/moderators/users/${u.id}`,{method:'PATCH',body:JSON.stringify({action,role,duration_hours:action==='suspend'?+$('punishDuration').value:null,reason:$('reason').value||null})});$('actionModal').classList.add('hidden');await Promise.all([loadUsers(),loadDashboard(),loadAudit()])}catch(e){msg('actionMsg',e.message,true)}};
async function openDetail(id){try{const d=await api(`/api/moderators/users/${id}/detail`);$('detailTitle').textContent=`@${d.user.username}`;$('detailBody').innerHTML=`<p>Criada em: ${esc(date(d.user.created_at))}<br>Último acesso à API: ${esc(date(d.user.last_seen_at))}</p><small>Horário local. Acesso autenticado, com precisão de aproximadamente um minuto. Leitura offline não é registrada.</small><div class="detail-stats"><div><b>${d.total_publications}</b><small>Envios</small></div><div><b>${d.approved_publications}</b><small>Aprovados</small></div><div><b>${d.rejected_publications}</b><small>Rejeitados</small></div><div><b>${d.pending_publications}</b><small>Pendentes</small></div></div><h3>Publicações</h3><div class="history">${d.publications.map(p=>`<div class="publication"><b>${esc(p.title)}</b><span class="badge">${esc(p.status)}</span><small>${date(p.created_at)}</small></div>`).join('')||'<p>Nenhuma publicação.</p>'}</div><h3 style="margin-top:18px">Ações recentes</h3><div class="history">${d.recent_actions.map(a=>`<div class="log"><b>${esc(a.action)}</b><small>por @${esc(a.actor_username)} · ${date(a.created_at)}</small>${a.reason?`<small class="error">${esc(a.reason)}</small>`:''}</div>`).join('')||'<p>Nenhuma ação.</p>'}</div>`;$('detailModal').classList.remove('hidden')}catch(e){alert(e.message)}}$('closeDetail').onclick=()=>$('detailModal').classList.add('hidden');
const actionNames={role_changed:'Cargo alterado',user_suspended:'Conta suspensa',user_banned:'Conta banida',punishment_cleared:'Punição removida',sessions_revoked:'Sessões encerradas',user_deleted:'Conta excluída',invite_created:'Convite criado',invite_revoked:'Convite revogado'};async function loadAudit(){const rows=await api('/api/moderators/audit');$('auditRows').innerHTML=rows.map(a=>`<div class="log"><b>${esc(actionNames[a.action]||a.action)}</b>${a.target_username?` <span>@${esc(a.target_username)}</span>`:''}<small>por @${esc(a.actor_username)} · ${date(a.created_at)}</small>${a.reason?`<small class="error">${esc(a.reason)}</small>`:''}${a.details?`<small>${esc(a.details)}</small>`:''}</div>`).join('')||'<p>Nenhuma ação.</p>'}$('refreshAudit').onclick=loadAudit;
</script></body></html>
